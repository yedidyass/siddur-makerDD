<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover,user-scalable=yes">
  <meta name="theme-color" content="#16243c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="כוונת הלב">
  <link rel="apple-touch-icon" href="/icons/icon-180.png"><link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css?v=40"><title>סידור כוונת הלב</title>
</head>
<body>
  <main id="home" class="home">
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <header class="brand"><img class="app-emblem" src="/icons/icon-192.png" alt="סמל סידור כוונת הלב"><div><span class="brand-kicker">סידור תפילה</span><h1>כוונת הלב</h1><p>נוסח ספרדים ועדות המזרח</p></div></header>
    <section class="today-card" aria-label="הנחיות תפילה להיום"><div id="hebrew-date" class="hebrew-date"></div><strong id="occasion" class="occasion" hidden></strong><div id="today-guidance" class="today-guidance"></div></section>
    <div class="section-title"><span></span><strong>בחר תפילה</strong><span></span></div>
    <div id="prayer-list" class="prayer-list">
      <section data-card="shacharit" class="prayer-card"><button class="primary" type="button" aria-expanded="false"><span class="prayer-icon">ש</span><span class="prayer-name">תפילת שחרית<small>תפילת הבוקר</small></span><span class="chevron">⌄</span></button><div class="quick-starts shacharit-starts" aria-label="חלוקת שחרית"><p data-service-guidance class="service-guidance"></p><button data-prayer="shacharit" data-start="29">ברכות השחר</button><button data-prayer="shacharit" data-start="69">אדון עולם, ציצית ותפילין</button><button data-prayer="shacharit" data-start="78">סדר העקדה</button><button data-prayer="shacharit" data-start="91">פרשת הקרבנות</button><button data-prayer="shacharit" data-start="109">הודו</button><button data-prayer="shacharit" data-start="120">ברוך שאמר</button><button data-prayer="shacharit" data-start="122">פסוקי דזמרה</button><button data-prayer="shacharit" data-start="144">קריאת שמע וברכותיה</button><button data-prayer="shacharit" data-start="164">שמונה עשרה</button><button data-ten-days data-prayer="shacharit" data-start="avinu-malkenu">אבינו מלכנו</button><button data-tachanun data-prayer="shacharit" data-start="196">סדר תחנון</button><button data-weekday-only data-prayer="shacharit" data-start="205">תחנונים לשני וחמישי</button><button data-torah data-prayer="shacharit" data-start="torah-service">הוצאת ספר תורה</button><button data-prayer="shacharit" data-start="218">אשרי</button><button data-prayer="shacharit" data-start="221">ובא לציון</button><button data-prayer="shacharit" data-start="song-of-day">שיר של יום</button><button data-prayer="shacharit" data-start="245">אין כאלהינו</button><button data-prayer="shacharit" data-start="246">פטום הקטורת</button></div></section>
    </div>
    <div id="offline-status" class="offline-status" aria-live="polite">מכין את הסידור לשימוש ללא אינטרנט…</div>
  </main>
  <section id="reader" class="reader" hidden><div id="book" class="book" dir="rtl"><div id="flipbook" class="flipbook" aria-label="עמודי הסידור"></div><div id="loading" class="loading">טוען…</div></div></section>
  <script src="/app.js?v=40" type="module"></script>
</body></html>
